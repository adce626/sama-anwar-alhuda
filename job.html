    </div>

  <header class="navbar" id="navbar"><div id="site-header"></div></header>

  <main role="main">
    <section class="page-hero" style="background:linear-gradient(135deg, #0f0f12 0%, #1a1a1f 50%, #0f0f12 100%);border-bottom:4px solid var(--color-red)">
      <div class="container">
        <span class="crumb">

          <i class="fas fa-chevron-right"></i>
          <a href="jobs.html" data-i18n="jobs.crumb"></a>

          <span data-i18n="jobs.detailCrumb"></span>
        </span>
        <span class="eyebrow" style="color:#ffd4d4" data-i18n="jobs.detailEyebrow"></span>
        <h1 class="reveal" style="color:#fff" id="jobDetailTitle">...</h1>
        <div class="job-detail-hero-meta reveal" id="jobDetailMeta"></div>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width:800px">
        <div id="jobDetailLoading" class="jobs-loading">
          <i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--color-red)"></i>
          <p data-i18n="jobs.loading"></p>
        </div>
        <div id="jobDetailContent" style="display:none">
          <div class="job-detail-body reveal" id="jobDetailBody"></div>

          <!-- Share -->
          <div class="job-share-row reveal">
            <span data-i18n="jobs.share"></span>
            <div class="job-share-btns" id="jobShareBtns"></div>
          </div>

          <!-- Apply Button -->
          <div class="job-apply-section reveal">
            <a class="btn btn-red btn-lg" id="jobApplyBtn" href="#">
              <i class="fas fa-paper-plane"></i> <span data-i18n="jobs.applyNow"></span>
            </a>
          </div>
        </div>

        <div id="jobDetailNotFound" style="display:none" class="jobs-empty">
          <i class="fas fa-exclamation-circle" style="font-size:3rem;color:var(--color-red);opacity:0.5"></i>
          <h3 data-i18n="jobs.notFound"></h3>
          <a href="jobs.html" class="btn btn-red" style="margin-top:16px"><i class="fas fa-arrow-right"></i> <span data-i18n="jobs.backToJobs"></span></a>
        </div>
      </div>
    </section>

    <!-- APPLICATION MODAL -->
    <div id="applyModal" class="modal-overlay" style="display:none">
      <div class="modal-content">
        <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
        <h3 data-i18n="jobs.applyTitle"></h3>
        <p class="modal-job-title" id="modalJobTitle"></p>
        <form id="applyForm">
          <input type="hidden" id="applyJobId" name="job_id">
          <div class="form-group">
            <label><i class="fas fa-user"></i> <span data-i18n="jobs.applyName"></span></label>
            <input type="text" id="applyFullName" name="full_name" required>
          </div>
          <div class="form-group">
            <label><i class="fas fa-phone"></i> <span data-i18n="jobs.applyPhone"></span></label>
            <input type="tel" id="applyPhone" name="phone" required dir="ltr">
          </div>
          <div class="form-group">
            <label><i class="fas fa-id-card"></i> <span data-i18n="jobs.applyId"></span></label>
            <div class="file-upload" id="fileUpload">
              <input type="file" id="applyIdImage" name="id_image" accept="image/*" required hidden>
              <div class="file-upload-label" id="fileUploadLabel">
                <i class="fas fa-cloud-upload-alt"></i>
                <span data-i18n="jobs.applyIdPh"></span>
              </div>
              <img id="filePreview" class="file-preview" style="display:none">
            </div>
          </div>
          <button type="submit" class="btn btn-red btn-lg" style="width:100%" id="applySubmitBtn">
            <i class="fas fa-paper-plane"></i> <span data-i18n="jobs.applySubmit"></span>
          </button>
          <div id="applySuccess" class="form-alert success" style="display:none">
            <i class="fas fa-check-circle"></i> <span data-i18n="jobs.applySuccess"></span>
          </div>
          <div id="applyError" class="form-alert error" style="display:none">
            <i class="fas fa-exclamation-triangle"></i> <span data-i18n="jobs.applyError"></span>
          </div>
        </form>
